[package]
name = "burn-enc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# No "autotune" (decided 2026-11-20, see NOTES "burn autotune"): ~2x slower encoder but no tuning delays/VRAM spikes.
# "persistence" keeps the compiled-kernel (SPIR-V) cache on disk (cubecl.toml [compilation] cache = true).
burn = { version = "0.22.1", default-features = false, features = ["std", "vulkan", "fusion", "persistence"] }
half = "2"
hound = "3"
realfft = "3"

[profile.release]
debug = 1
