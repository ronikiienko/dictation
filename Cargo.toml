[package]
name = "dictation"
version = "0.1.0"
edition = "2024"

[features]
# GPU kernel tuning (~40% faster encoder on the RTX 3050, 2.1x on the AMD iGPU), done once per GPU by the app's
# one-time optimization. `--no-default-features` builds without it. No effect on macOS (no GPU path there).
default = ["autotune"]
autotune = ["burn/autotune"]

[dependencies]
bytemuck = "1"
bytes = "1"
half = "2"
memmap2 = "0.9"
# CPU encoder (src/asr/cpu.rs): threads and f32 matrix products (both pure Rust).
rayon = "1"
matrixmultiply = "0.3"
realfft = "3"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
directories = "6.0.0"
futures-util = "0.3.34"
hound = "3"
jiff = "1.0.1"
libc = "0.2.191"
log = "0.4.35"
notify-rust = { version = "4.19.0", default-features = false, features = ["z-with-tokio"] }
open = "5.4.5"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
toml = "1.2.1"
ureq = "3.5.2"
interprocess = { version = "2.4.9", features = ["tokio"] }
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-opus = "0.1.3"
rubato = "5.1.0"
opus-pure = "0.2.5"
rfd = "0.18.0"

# The GPU path (src/asr/encoder.rs, gpu.rs; Linux, Windows): burn on CubeCL, Vulkan (kernels as SPIR-V, not WGSL).
# macOS has no GPU path (Neural Engine or CPU), so no burn there; build.rs sets `cfg(gpu)` for the code using it.
# "autotune" comes from our feature of that name; "persistence" keeps compiled GPU kernels on disk (cache folder set
# in asr::set_kernel_cache). cubecl-runtime only for that config.
[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { version = "0.22.1", default-features = false, features = ["std", "fusion", "persistence", "vulkan"] }
cubecl-runtime = { version = "0.11.4", default-features = false }
buildid = { version = "1.1.0", features = ["buildid-custom-inject"] } # see lib.rs build_id__get

[target.'cfg(target_os = "macos")'.dependencies]
# Parakeet Ultra's encoder on the Neural Engine (src/asr/ane.rs, CoreML). Only the features used.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue"] }
objc2-core-ml = { version = "0.3.2", default-features = false, features = ["std", "MLModel", "MLModelConfiguration", "MLModelDescription", "MLFeatureDescription", "MLMultiArrayConstraint", "MLMultiArray", "MLFeatureValue", "MLFeatureProvider", "MLDictionaryFeatureProvider"] }

# Linux: global shortcut via the desktop portal (ashpd), tray via D-Bus (ksni), paste via its own virtual keyboard
# (evdev, /dev/uinput); all work on X11 and Wayland. Elsewhere: global-hotkey, tray-icon on tao, enigo.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14.1", default-features = false, features = ["tokio", "global_shortcuts"] }
evdev = "0.13.2"
ksni = "0.3.7"

[target.'cfg(not(target_os = "linux"))'.dependencies]
enigo = "0.6.1"
global-hotkey = "0.10.0"
tao = "0.37.3"
tray-icon = "0.26.1"

[profile.release]
debug = 1

# Research tool, not part of the app: WER/timing check on recorded takes.
[[example]]
name = "check"
path = "experiments/check.rs"

[[example]]
name = "rec"
path = "experiments/rec.rs"

[[example]]
name = "words"
path = "experiments/words.rs"

[[example]]
name = "redux"
path = "experiments/redux.rs"

[[example]]
name = "anebuild"
path = "experiments/anebuild.rs"

[[example]]
name = "phonon"
path = "experiments/phonon.rs"

[[example]]
name = "appicon"
path = "experiments/appicon.rs"
